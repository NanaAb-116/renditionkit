name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: renditionkit
          POSTGRES_PASSWORD: renditionkit
          POSTGRES_DB: renditionkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U renditionkit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start MinIO
        run: >-
          docker run --detach --name renditionkit-minio --publish 9000:9000
          --env MINIO_ROOT_USER=renditionkit
          --env MINIO_ROOT_PASSWORD=renditionkit-dev-secret
          bitnamilegacy/minio:2025.7.23@sha256:8935e75fa5d11295c17171e4aa49efe390a1193cd7f12e4d21b92af9ffef09d7
      - name: Wait for MinIO
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs renditionkit-minio
          exit 1
      - run: pnpm check
        env:
          RENDITIONKIT_REDIS_PORT: 6379
          RENDITIONKIT_POSTGRES_URL: postgres://renditionkit:renditionkit@127.0.0.1:5432/renditionkit
          RENDITIONKIT_S3_ENDPOINT: http://127.0.0.1:9000
          RENDITIONKIT_S3_REGION: us-east-1
          RENDITIONKIT_S3_ACCESS_KEY_ID: renditionkit
          RENDITIONKIT_S3_SECRET_ACCESS_KEY: renditionkit-dev-secret
