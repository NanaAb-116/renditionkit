name: Release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type publish to release the unscoped renditionkit package
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: inputs.confirm == 'publish'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install an OIDC-capable npm CLI
        run: npm install --global npm@^11.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm release
