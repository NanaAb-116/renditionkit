name: Release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type publish to release the unscoped renditionkit package
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: inputs.confirm == 'publish'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm release
