x-app-environment: &app-environment
  DATABASE_URL: postgres://renditionkit:renditionkit@postgres:5432/renditionkit
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_DB: 2
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_ACCESS_KEY_ID: renditionkit
  S3_SECRET_ACCESS_KEY: renditionkit-dev-secret
  S3_BUCKET: renditionkit

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: renditionkit
      POSTGRES_PASSWORD: renditionkit
      POSTGRES_DB: renditionkit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U renditionkit"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: bitnamilegacy/minio:2025.7.23@sha256:8935e75fa5d11295c17171e4aa49efe390a1193cd7f12e4d21b92af9ffef09d7
    environment:
      MINIO_ROOT_USER: renditionkit
      MINIO_ROOT_PASSWORD: renditionkit-dev-secret
    ports:
      - "9101:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - minio-data:/bitnami/minio/data

  api:
    build:
      context: ../..
      dockerfile: examples/reference/Dockerfile
    image: renditionkit-reference:local
    environment:
      <<: *app-environment
      PORT: 4100
    command: ["node", "examples/reference/dist/api.js"]
    ports:
      - "4100:4100"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    image: renditionkit-reference:local
    environment:
      <<: *app-environment
      WORKER_CONCURRENCY: 2
    command: ["node", "examples/reference/dist/worker.js"]
    mem_limit: 1g
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres-data:
  minio-data:
